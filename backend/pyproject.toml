[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compfinder-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "pillow>=10,<13", "numpy>=1.26,<3", "onnxruntime>=1.18,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["compfinder*"]

[tool.setuptools.package-data]
compfinder = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
